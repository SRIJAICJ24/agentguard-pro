# Publish to TestPyPI or PyPI with Trusted Publishing (OIDC): no stored tokens.
#
# Manual trigger only (Actions -> Release -> Run workflow). Publish to TestPyPI
# first; publish to PyPI only from a version tag (run the workflow "from" the tag,
# e.g. v0.4.0), and only after the `pypi` environment's required reviewer approves.
#
# One-time setup (see CONTRIBUTING or the launch checklist):
#   - pypi.org and test.pypi.org -> Account -> Publishing -> add a pending GitHub
#     publisher: project "agentguard", owner SRIJAICJ24, repo agentguard-pro,
#     workflow "release.yml", environment "pypi" / "testpypi".
#   - GitHub -> Settings -> Environments: create `testpypi` and `pypi`; give `pypi`
#     a required reviewer and restrict it to tags matching v*.
# Follows https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The wheel works on its own
        working-directory: ${{ runner.temp }}
        env:
          AGENTGUARD_HOME: ${{ runner.temp }}/agentguard-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          python -m venv venv
          venv/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          venv/bin/agentguard --version
          venv/bin/agentguard simulate --min-score 100 --db "$RUNNER_TEMP/sim.db"
          venv/bin/agentguard demo
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agentguard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: inputs.target == 'pypi' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentguard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
