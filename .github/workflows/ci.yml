name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      # Tests and `simulate` write state. Keep it inside the runner's temp dir,
      # never in a real ~/.agentguard or ~/.claude. (The `runner` context isn't
      # available in job-level env, so this is set from a step.)
      - name: State in the runner's temp dir
        shell: bash
        run: |
          echo "AGENTGUARD_HOME=$RUNNER_TEMP/agentguard-home" >> "$GITHUB_ENV"
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests -q
      - name: Red-team simulator (must score 100)
        run: python -m agentguard.cli simulate --min-score 100 --db "${{ runner.temp }}/sim.db"

  wheel:
    name: Wheel works without the source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the wheel into a clean venv
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Run from outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          AGENTGUARD_HOME: ${{ runner.temp }}/agentguard-home
        run: |
          "$RUNNER_TEMP/venv/bin/agentguard" --version
          "$RUNNER_TEMP/venv/bin/agentguard" simulate --min-score 100 --db "$RUNNER_TEMP/sim.db"
          "$RUNNER_TEMP/venv/bin/agentguard" scan "the weather is nice in paris today"
          "$RUNNER_TEMP/venv/bin/agentguard" demo
          "$RUNNER_TEMP/venv/bin/agentguard" status
