# AgentGuard policy
#
# Enforcement is OFF by default: every decision is still computed and written to
# the audit log, but nothing is actually blocked. Run in this mode first, read
# `agentguard audit --last 50`, confirm the false-positive rate is acceptable on
# your own traffic, then flip enforcement to true.
enforcement: false

# Hard-enforced rules block even in observe mode; every other rule keeps observe
# behaviour (log only). Delete a line to make that rule observe-only again;
# `hard_enforce: []` gives back plain all-observe behaviour.
#   credential_files     reading ~/.ssh, ~/.aws or .env files (writes and
#                        name-only listings are not covered)
#   secret_exfiltration  a real secret in a call that sends data out (email,
#                        upload, curl/wget to an unlisted host, ...)
#   self_protection      the agent editing AgentGuard's own config, policy, audit
#                        database, or the Claude Code settings that register its hooks
hard_enforce:
  - credential_files
  - secret_exfiltration
  - self_protection

thresholds:
  allow_below: 0.25    # score < this            -> ALLOW
  block_above: 0.75    # score > this            -> BLOCK, in between -> REVIEW

tools:
  # An explicit deny always wins, before any score is computed.
  deny:
    - "*.delete_all"
    - "system.exec"
  allow: []            # empty = allow anything not explicitly denied

# Least privilege per agent identity. A research agent and a coding agent get
# genuinely different permissions.
roles:
  researcher:
    allow: ["web.*", "filesystem.read", "memory.*"]
    deny: ["filesystem.write", "*delete*", "email.send"]
  coder:
    allow: ["filesystem.*", "git.*", "memory.*", "web.search"]
    deny: ["email.send", "*.delete_all"]
  readonly:
    # A non-empty allow list is already deny-by-default: anything unlisted is
    # blocked. Do not add `deny: ["*"]` here - deny is evaluated first and always
    # wins, so a catch-all deny would cancel the allow list entirely.
    allow: ["*.read", "*.search", "*.list"]
    deny: []

paths:
  # Checked with glob matching, independent of the secrets engine - a different
  # signal deserves its own list.
  deny:
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.env"
    - "**/.env.*"
    - "**/credentials/**"
    - "**/id_rsa*"
    - "**/.netrc"
    - "**/.kube/config"
  # Reads from these are treated as TRUSTED input for taint purposes.
  trusted_read:
    - "./**"
    - "docs/**"
    - "src/**"

# Which tools return content that must be treated as untrusted.
taint:
  untrusted_tools:
    - "web.*"
    - "*search*"
    - "*fetch*"
    - "*browse*"
    - "email.read*"
    - "*inbox*"
    - "rag.*"
  on_exfiltration: REVIEW      # or BLOCK

# Sink tiers. Anything unmatched is `ordinary` (logged only).
sinks:
  replace_defaults: false      # true = ignore built-in globs, use only these
  exfiltration:
    - "email.send"
    - "web.post"
    - "*webhook*"
    - "*upload*"
  persistence:
    - "memory.save"
    - "*memory_save*"
    - "*vector*"
    - "rag.index*"
  # Stage 7 tiers are *additional*: a call keeps its tier above and can also be in
  # these (email.send is exfiltration AND propagation; the stricter verdict wins).
  # Built-in defaults cover file writes, git commits, PR/issue comments, document
  # edits, chat posts and email; entries here are added to them.
  propagation: []
  financial: []        # built-ins: *payment*, *purchase*, *checkout*, *refund*, ...

# --- Stage 7 detectors -------------------------------------------------------
# Each one computes and logs by default and only stops a call when `enforcement`
# is true. `enabled: false` turns one off entirely. Watch their signal names in
# `agentguard report --since 7d` before turning enforcement on.

# 7A: self-replicating injection - untrusted text with AI-addressed instructions
# copied into a propagation sink -> REVIEW (signal propagation:replication).
propagation:
  enabled: true

# 7B: volume-aware DLP on exfiltration/propagation sinks.
classification:
  enabled: true
  thresholds:
    confidential: 10   # email+phone count at/above which the payload is CONFIDENTIAL
    pii: 50            # ... and PII. Any card/PAN/Aadhaar number is PII outright.
  max_label:           # most sensitive label allowed out, per sink tier
    default: {exfiltration: CONFIDENTIAL, propagation: PII}
    # researcher: {exfiltration: INTERNAL}
  actions:             # what happens above the limit: log | redact | review | block
    SECRET: block
    PII: block
    CONFIDENTIAL: review
    INTERNAL: log

# 7C: declared task scope. Set per session with `agentguard scope set`, or per
# role with `roles.<role>.scope: [...]`. Out-of-scope calls -> REVIEW.
scope:
  enabled: true
  reserved_tools: []   # added to the always-reserved "agentguard*" namespace

# 7C: optional model-based alignment check on the deep path. Off by default;
# only a loopback endpoint is accepted unless allow_remote is true.
alignment:
  auditor: none        # none | openai_compatible
  # endpoint: http://127.0.0.1:11434/v1
  # model: llama3.1

# 7D: every financial call is held for REVIEW. Optional per-session cap.
financial:
  enabled: true
  # session_cap: {amount: 200, currency: USD}

# --- Claude Code hooks (readiness phase) --------------------------------------
# What AgentGuard does with Claude Code's own tools (Bash, PowerShell, Read,
# Write, Edit, WebFetch, WebSearch, ...), delivered by the hooks that
# `agentguard install-hooks` registers. Observe mode never interferes: it logs
# what it would do. Enforce mode: BLOCK -> deny, REVIEW -> ask (Claude Code's own
# permission prompt). Patterns are Python regexes, matched case-insensitively
# against the whole shell command; a list given here replaces that default list.
hooks:
  enabled: true
  # MCP servers already routed through the AgentGuard gateway. The gateway gates
  # (and logs) their calls; the hook only bridges taint, so nothing counts twice.
  gateway_servers: ["agentguard"]
  # A network command to any other host joins the exfiltration tier.
  allow_hosts: ["localhost", "127.0.0.1", "::1"]
  untrusted_tools: ["WebFetch", "WebSearch"]   # their results are taint sources
  bash:
    exfiltration:
      - '\b(curl|wget|nc|ncat|netcat|socat|telnet|scp|sftp|ftp|rsync)\b'
      - '\b(Invoke-WebRequest|Invoke-RestMethod|iwr|Start-BitsTransfer)\b'
    propagation:
      - '\bgit\s+(commit|push)\b'
      - '\bgh\s+(pr|issue)\s+(create|comment|edit|review)\b'
      - '(?<![0-9&=\-])>{1,2}\s*(?!&|/dev/null\b|\$null\b|nul\b)[^\s|&;>]+'
      - '\b(Set-Content|Add-Content|Out-File)\b'
    destructive:                   # -> REVIEW
      - '\brm\s+(-[a-z]*r[a-z]*|--recursive)\b'
      - '\bRemove-Item\b[^\n]*-Recurse\b'
      - '\b(rmdir|rd)\s+/s\b'
      - '\bdel\s+(/[a-z]\s+)*/s\b'
      - '\bmkfs(\.\w+)?\b'
      - '\bdd\s+[^\n]*\bof=/dev/'
      - '\bformat\s+[a-z]:'
      - '\b(diskpart|shred|wipefs)\b'
      - '\bFormat-Volume\b|\bClear-Disk\b'
  # Writes, edits and shell commands touching AgentGuard's own config, policy,
  # audit database, the Claude Code settings that register these hooks, or its
  # daemon -> REVIEW, and deny in enforce mode. This raises the bar; it does not
  # stop a determined process running as the same user.
  self_protection:
    enabled: true

quarantine:
  ttl_hours:
    default: 24       # web-sourced content expires after a day
    reviewed: 0       # 0 = indefinite but permanently flagged

egress:
  allow_hosts: []     # empty = every destination counts as unknown
